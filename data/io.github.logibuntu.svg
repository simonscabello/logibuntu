<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0662E"/>
      <stop offset="1" stop-color="#77216F"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9E3EE"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2C0A2A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- background squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>
  <!-- headset band arching over the mouse -->
  <path d="M30 70 V58 a34 34 0 0 1 68 0 V70" fill="none" stroke="#FFFFFF" stroke-opacity="0.55"
        stroke-width="7" stroke-linecap="round"/>
  <rect x="22" y="62" width="14" height="24" rx="7" fill="#FFFFFF" fill-opacity="0.55"/>
  <rect x="92" y="62" width="14" height="24" rx="7" fill="#FFFFFF" fill-opacity="0.55"/>
  <!-- mouse -->
  <g filter="url(#shadow)">
    <path d="M64 40 c-13 0 -22 10 -22 24 v18 c0 13 9 22 22 22 s22 -9 22 -22 v-18 c0 -14 -9 -24 -22 -24 z"
          fill="url(#body)"/>
  </g>
  <path d="M64 40 v22 M42 62 h44" stroke="#77216F" stroke-opacity="0.35" stroke-width="2.5" fill="none"/>
  <!-- scroll wheel glowing in Ubuntu orange -->
  <rect x="60" y="47" width="8" height="12" rx="4" fill="#E95420"/>
</svg>
